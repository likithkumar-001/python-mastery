<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Mastery – Beginner to Advanced + DSA</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐍</text></svg>">
</head>
<body>
    <!-- Search Modal -->
    <div id="search-modal" class="modal hidden">
        <div class="modal-overlay" onclick="SearchModule.close()"></div>
        <div class="modal-content search-modal">
            <div class="search-header">
                <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.35-4.35"></path>
                </svg>
                <input type="text" id="search-input" placeholder="Search topics, concepts, or keywords..." autofocus>
                <kbd>ESC</kbd>
            </div>
            <div id="search-results" class="search-results"></div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Hint/Solution Modal -->
    <div id="hint-modal" class="modal hidden">
        <div class="modal-overlay" onclick="closeModal('hint-modal')"></div>
        <div class="modal-content" style="max-width:600px">
            <div class="modal-header">
                <h3 id="hint-modal-title">Hint</h3>
                <button onclick="closeModal('hint-modal')" class="btn-icon">&times;</button>
            </div>
            <div id="hint-modal-body" class="modal-body"></div>
        </div>
    </div>

    <!-- App Container -->
    <div id="app" class="app-container">
        <!-- Sidebar -->
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <span class="logo-icon">🐍</span>
                    <span class="logo-text">Python Mastery</span>
                </div>
                <button id="sidebar-toggle" class="btn-icon sidebar-toggle" onclick="Sidebar.toggle()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 12h18M3 6h18M3 18h18"></path>
                    </svg>
                </button>
            </div>
            <div class="sidebar-search" onclick="SearchModule.open()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.35-4.35"></path>
                </svg>
                <span>Search topics...</span>
                <kbd>Ctrl+K</kbd>
            </div>
            <nav id="sidebar-nav" class="sidebar-nav">
                <!-- Populated by JS -->
            </nav>
            <div class="sidebar-footer">
                <div class="theme-toggle" onclick="ThemeManager.toggle()">
                    <span id="theme-icon">🌙</span>
                    <span id="theme-label">Dark Mode</span>
                </div>
            </div>
        </aside>

        <!-- Mobile sidebar overlay -->
        <div id="sidebar-overlay" class="sidebar-overlay hidden" onclick="Sidebar.closeMobile()"></div>

        <!-- Main Content -->
        <main id="main-content" class="main-content">
            <!-- Top Bar -->
            <header class="top-bar">
                <div class="top-bar-left">
                    <button class="btn-icon mobile-menu-btn" onclick="Sidebar.openMobile()">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 12h18M3 6h18M3 18h18"></path>
                        </svg>
                    </button>
                    <div id="breadcrumb" class="breadcrumb"></div>
                </div>
                <div class="top-bar-right">
                    <div class="streak-counter" id="streak-display">
                        <span class="streak-flame">🔥</span>
                        <span id="streak-count">0</span>
                        <span class="streak-label">day streak</span>
                    </div>
                    <button class="btn-icon" onclick="SearchModule.open()" title="Search (Ctrl+K)">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"></circle>
                            <path d="m21 21-4.35-4.35"></path>
                        </svg>
                    </button>
                    <button class="btn-icon" onclick="ThemeManager.toggle()" title="Toggle theme">
                        <span id="theme-toggle-icon">🌙</span>
                    </button>
                </div>
            </header>

            <!-- Page Content -->
            <div id="page-content" class="page-content">
                <!-- Populated by router -->
            </div>
        </main>
    </div>

    <!-- Scripts - Order matters! -->
    <script src="data/python-syllabus.js"></script>
    <script src="data/dsa-syllabus.js"></script>
    <script src="data/python-content.js"></script>
    <script src="data/dsa-content.js"></script>
    <script src="data/questions.js"></script>
    <script src="data/projects.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/progress.js"></script>
    <script src="js/components.js"></script>
    <script src="js/search.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/topic-viewer.js"></script>
    <script src="js/playground.js"></script>
    <script src="js/visualizer.js"></script>
    <script src="js/tests.js"></script>
    <script src="js/projects.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
